name: listencare
description: Accessible English and Urdu live captions and private conversation notes.
publish_to: 'none'
version: 2.1.0+3

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/brand/listencare.png
  web:
    generate: true
    image_path: assets/brand/listencare.png
    background_color: '#F7F2FF'
    theme_color: '#A87BEF'
  windows:
    generate: true
    image_path: assets/brand/listencare.png
  macos:
    generate: true
    image_path: assets/brand/listencare.png
